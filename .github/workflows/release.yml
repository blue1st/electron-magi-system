name: Build and Release MAGI System

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app binaries
        run: npm run build && npx electron-builder --mac zip --publish never

      - name: Draft GitHub Release & Upload Artifacts
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate GitHub App Token
        if: startsWith(github.ref, 'refs/tags/v')
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: blue1st
          repositories: homebrew-taps

      - name: Update Homebrew Tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          chmod +x ./scripts/update-homebrew.sh
          ./scripts/update-homebrew.sh
